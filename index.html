<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra</title>
  <meta name="theme-color" content="#2F6B4F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="compra.css">
</head>
<body>
  <section id="acceso" class="acceso" hidden>
    <div class="tarjeta">
      <h1>Compra</h1>
      <p>Introduce tu correo y tu clave para entrar.</p>
      <form id="formAcceso">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" autocomplete="username" required>
        <label for="clave">Clave</label>
        <input id="clave" type="password" autocomplete="current-password" required>
        <p id="error" class="error" role="alert"></p>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <aside class="lateral">
      <div class="marca">Compra</div>
      <nav id="menu" class="menu" aria-label="Secciones"></nav>
    </aside>
    <main class="contenido">
      <header class="cabecera">
        <h1 id="titulo">Inicio</h1>
        <span><span class="usuario" id="usuario"></span><button class="btn-salir" id="salir" type="button">Salir</button></span>
      </header>
      <section id="vista" class="vista" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
